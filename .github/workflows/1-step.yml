name: Paso 1 — Patrón Behaviour y Marcha

on:
  push:
    branches:
      - main
    paths:
      - 'app/shared/src/commonMain/kotlin/io/github/kevinah95/l08_activity/core/Behaviour.kt'
      - 'app/shared/src/commonMain/kotlin/io/github/kevinah95/l08_activity/behaviours/Behaviours.kt'

jobs:
  check_step_1:
    name: Verificar Paso 1
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar si el issue está en el Paso 1
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=$(gh issue list --label "ejercicio" --state open --json number --jq '.[0].number')
          if [ -z "$ISSUE_NUMBER" ] || [ "$ISSUE_NUMBER" = "null" ]; then
            echo "⏭️ No hay issue de ejercicio abierto. Omitiendo."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -q "^paso-1$"; then
            echo "⏭️ El issue no tiene la etiqueta 'paso-1'. Este paso no está activo."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        if: steps.gate.outputs.active == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ejecutar pruebas unitarias de Paso 1
        if: steps.gate.outputs.active == 'true'
        id: test
        run: |
          cd app
          chmod +x ./gradlew
          if ./gradlew :shared:jvmTest --tests "*Step1BehaviourTest*" --no-daemon; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Las pruebas del Paso 1 aún no pasan."
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Transicionar a Paso 2 en el issue
        if: steps.gate.outputs.active == 'true' && steps.test.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ steps.gate.outputs.issue_number }}"
          gh issue edit "$ISSUE_NUMBER" --remove-label "paso-1" --add-label "paso-2"
          gh issue comment "$ISSUE_NUMBER" \
            --body "$(cat .github/steps/2-step.md)"

name: Paso 3 — Ciclo de Muerte y Cadáveres

on:
  push:
    branches:
      - main
    paths:
      - 'app/shared/src/commonMain/kotlin/io/github/kevinah95/l08_activity/entities/Entities.kt'
      - 'app/shared/src/commonMain/kotlin/io/github/kevinah95/l08_activity/core/Game.kt'

jobs:
  check_step_3:
    name: Verificar Paso 3
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ejecutar pruebas unitarias de Paso 3
        id: check
        run: |
          cd app
          chmod +x ./gradlew
          if ./gradlew :shared:jvmTest --tests "*Step3CorpseDropTest*" --no-daemon; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "⏭️ Paso 3 aún no completado o pruebas fallidas."
          fi

      - name: Publicar Paso 4 en el issue
        if: steps.check.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=$(gh issue list --label "ejercicio" --state open --json number --jq '.[0].number')
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "⏭️ No hay issue de ejercicio abierto — omitiendo comentario."
            exit 0
          fi
          gh issue comment "$ISSUE_NUMBER" \
            --body "$(cat .github/steps/4-step.md)"

name: Paso 4 — Resurrección y Esqueletos (Último Paso)

on:
  push:
    branches:
      - main
    paths:
      - 'app/shared/src/commonMain/kotlin/io/github/kevinah95/l08_activity/entities/Entities.kt'
      - 'app/shared/src/commonMain/kotlin/io/github/kevinah95/l08_activity/core/Game.kt'

jobs:
  check_step_4:
    name: Verificar Paso 4
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar si el issue está en el Paso 4
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=$(gh issue list --label "ejercicio" --state open --json number --jq '.[0].number')
          if [ -z "$ISSUE_NUMBER" ] || [ "$ISSUE_NUMBER" = "null" ]; then
            echo "⏭️ No hay issue de ejercicio abierto. Omitiendo."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' | grep -q "^paso-4$"; then
            echo "⏭️ El issue no tiene la etiqueta 'paso-4'. Este paso no está activo."
            echo "active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "active=true" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        if: steps.gate.outputs.active == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ejecutar pruebas unitarias de Paso 4
        if: steps.gate.outputs.active == 'true'
        id: test
        run: |
          cd app
          chmod +x ./gradlew
          if ./gradlew :shared:jvmTest --tests "*Step4SkeletonArmyTest*" --no-daemon; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Las pruebas del Paso 4 aún no pasan."
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Publicar felicitaciones finales y cerrar issue
        if: steps.gate.outputs.active == 'true' && steps.test.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER="${{ steps.gate.outputs.issue_number }}"
          gh issue edit "$ISSUE_NUMBER" --remove-label "paso-4" --add-label "completado"
          gh issue comment "$ISSUE_NUMBER" \
            --body "$(cat .github/steps/finish.md)"
          gh issue close "$ISSUE_NUMBER" \
            --comment "🎓 ¡Práctica 08 completada exitosamente! Has creado el sistema de nigromancia e IA."
